<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | KUTIN BINARY</title>
    <!-- Tailwind CSS (Makes the layout look exactly like the reference) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kutin: {
                            bg: '#141021',
                            card: '#1F1936',
                            cardHover: '#282041',
                            accent: '#7C3AED',
                            success: '#22c55e',
                            danger: '#ff444f'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-kutin-bg text-gray-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- DESKTOP HEADER -->
    <header class="h-14 bg-kutin-card border-b border-white/[0.07] flex items-center justify-between px-4 sticky top-0 z-50 hidden md:flex">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-kutin-accent to-pink-500 flex items-center justify-center">
                    <i data-lucide="trending-up" class="text-white w-4 h-4"></i>
                </div>
                <span class="font-bold text-white">KUTIN BINARY</span>
            </a>
            <nav class="flex items-center gap-1">
                <a href="dashboard.html" class="flex items-center gap-2 px-3 py-2 rounded bg-kutin-cardHover text-white text-sm"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> Trade</a>
                <a href="deposit.html" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-kutin-cardHover text-gray-400 hover:text-white transition-colors text-sm"><i data-lucide="circle-arrow-down" class="w-4 h-4"></i> Deposit</a>
                <a href="withdraw.html" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-kutin-cardHover text-gray-400 hover:text-white transition-colors text-sm"><i data-lucide="circle-arrow-up" class="w-4 h-4"></i> Withdraw</a>
                <a href="history.html" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-kutin-cardHover text-gray-400 hover:text-white transition-colors text-sm"><i data-lucide="history" class="w-4 h-4"></i> History</a>
            </nav>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-kutin-cardHover border border-white/[0.07]">
                <div class="w-6 h-6 rounded bg-kutin-accent flex items-center justify-center text-xs font-bold text-white">U</div>
                <span class="text-sm font-bold text-kutin-accent" id="header-balance">$0.00</span>
            </div>
            <button id="logout-btn" class="p-2 rounded bg-kutin-cardHover hover:bg-white/10 border border-white/[0.07] transition-colors">
                <i data-lucide="log-out" class="w-4 h-4 text-gray-400"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- LEFT: Chart Area -->
        <main class="flex-1 flex flex-col relative bg-[#151a25]">
            <div class="absolute top-3 left-4 z-10">
                <button class="flex items-center gap-2 px-3 py-2 rounded-lg bg-[#1e2535] border border-[#2a3548] shadow-lg">
                    <div class="w-7 h-7 rounded-lg bg-[#252d3d] flex items-center justify-center">
                        <i data-lucide="bar-chart-2" class="text-kutin-accent w-4 h-4"></i>
                    </div>
                    <div class="flex flex-col items-start">
                        <span class="text-sm font-medium text-white">Volatility 100 (1s) Index</span>
                        <span class="text-xs text-gray-400">9517.81 <span class="text-kutin-success">+0.19%</span></span>
                    </div>
                </button>
            </div>
            
            <!-- Chart Canvas Placeholder -->
            <div class="flex-1 flex items-center justify-center">
                <canvas id="trading-chart" class="w-full h-full"></canvas>
            </div>
        </main>

        <!-- RIGHT: Trading Controls (From your shared code layout) -->
        <aside class="w-[310px] flex flex-col border-l border-white/[0.07] bg-kutin-card shrink-0">
            <div class="flex-1 overflow-y-auto p-3 space-y-4">
                
                <!-- Stake Amount -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[11px] font-semibold uppercase tracking-wider text-gray-500">Stake Amount</span>
                    </div>
                    <div class="relative rounded-2xl p-1 mb-2 bg-kutin-accent/5 border border-kutin-accent/20">
                        <div class="flex items-center">
                            <button class="w-10 h-12 flex items-center justify-center rounded-l-xl text-kutin-accent hover:bg-white/5" onclick="adjustStake(-1)">
                                <i data-lucide="minus" class="w-5 h-5"></i>
                            </button>
                            <div class="flex-1 flex items-baseline justify-center gap-1">
                                <span class="text-sm font-bold text-kutin-accent">$</span>
                                <input type="number" id="stake-amount" value="10.00" class="w-24 bg-transparent text-center text-2xl font-extrabold outline-none text-white" step="1">
                            </div>
                            <button class="w-10 h-12 flex items-center justify-center rounded-r-xl text-kutin-accent hover:bg-white/5" onclick="adjustStake(1)">
                                <i data-lucide="plus" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex gap-1.5">
                        <button class="flex-1 py-1.5 rounded-lg text-[11px] font-bold bg-kutin-bg text-gray-500 border border-white/10 hover:bg-white/5">$1</button>
                        <button class="flex-1 py-1.5 rounded-lg text-[11px] font-bold bg-kutin-bg text-gray-500 border border-white/10 hover:bg-white/5">$5</button>
                        <button class="flex-1 py-1.5 rounded-lg text-[11px] font-bold bg-kutin-accent/20 text-kutin-accent border border-kutin-accent/30">$10</button>
                        <button class="flex-1 py-1.5 rounded-lg text-[11px] font-bold bg-kutin-bg text-gray-500 border border-white/10 hover:bg-white/5">$50</button>
                    </div>
                </div>

                <!-- Trade Buttons -->
                <div class="space-y-2 pt-2">
                    <button class="w-full flex items-center justify-between p-3.5 rounded-xl border border-kutin-success/25 bg-kutin-success/5 hover:bg-kutin-success/10 transition-all active:scale-[0.98]">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-kutin-success/10 flex items-center justify-center text-kutin-success">
                                <i data-lucide="trending-up" class="w-4 h-4"></i>
                            </div>
                            <span class="font-semibold text-white">Even</span>
                        </div>
                        <div class="text-right">
                            <div class="text-[11px] text-gray-400">19.52 USD</div>
                            <div class="text-xs font-bold text-kutin-success">95.22%</div>
                        </div>
                    </button>

                    <button class="w-full flex items-center justify-between p-3.5 rounded-xl border border-kutin-danger/25 bg-kutin-danger/5 hover:bg-kutin-danger/10 transition-all active:scale-[0.98]">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-kutin-danger/10 flex items-center justify-center text-kutin-danger">
                                <i data-lucide="trending-down" class="w-4 h-4"></i>
                            </div>
                            <span class="font-semibold text-white">Odd</span>
                        </div>
                        <div class="text-right">
                            <div class="text-[11px] text-gray-400">19.52 USD</div>
                            <div class="text-xs font-bold text-kutin-danger">95.22%</div>
                        </div>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Supabase Setup (REPLACE THESE WITH YOUR REAL KEYS)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Auth Check
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html'; // Redirect if not logged in
            } else {
                // TODO: Fetch real balance from Supabase here
                document.getElementById('header-balance').innerText = '$1,250.00'; 
            }
        }

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        // Stake Adjuster
        function adjustStake(amount) {
            const input = document.getElementById('stake-amount');
            let val = parseFloat(input.value) || 0;
            val = Math.max(1, val + amount);
            input.value = val.toFixed(2);
        }

        checkAuth();
    </script>
</body>
</html>
